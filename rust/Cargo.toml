[package]
name = "tree2"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Parser, serializer and AST for the tree format — a whitespace-significant structural format with no escaping rules"
documentation = "https://docs.rs/tree2"
repository = "https://github.com/b-on-g/tree2"
homepage = "https://github.com/b-on-g/tree2"
readme = "README.md"
license = "MIT"
keywords = ["tree", "parser", "serializer", "ast", "config"]
categories = ["parser-implementations", "encoding", "data-structures"]

[dependencies]
# Only pulled in by the optional `serde` feature, which adds conversions
# between `Json` and `serde_json::Value`. The core crate has no dependencies.
serde_json = { version = "1", optional = true }

[dev-dependencies]
# The conformance suite reads ../fixtures/*.json at test time.
serde_json = "1"

[features]
default = []
serde = ["dep:serde_json"]

[lints.rust]
missing_docs = "warn"
